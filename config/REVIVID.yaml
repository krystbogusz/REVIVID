# REVIVID — old film restoration + 2x SR + inpainting of holes burned through
# the whole window, aimed at REALISM: a viewer should not tell what was repaired.
#
# One network, trained in two phases picked by training.stage; each phase is
# its own run (python src/trainer/train.py), resumed automatically from its
# <exp_dir>/checkpoints/latest.pth. A value written as {restore: a, inpaint: b}
# takes the one of the current phase.
#   PHASE 1 — stage: restore
#       removal of all degradations (dirt, scratches, blur, noise, compression)
#       + 2x SR. MambaOFR's network and training recipe, trained from scratch;
#       the target is at least MambaOFR's quality. No holes, the phase-2
#       modules are off.
#   PHASE 2 — stage: inpaint
#       fine-tuning of the whole phase-1 model (training.init_from): it finds
#       the burned-in holes itself and fills them (propagation from the frames
#       where the content is visible + the Mamba inpainter for what no frame
#       shows), with a stronger GAN so that no repair can be seen. Before it,
#       recreate the validation pairs with holes:
#           PYTHONPATH=src python -m dataset.create_dataset valid --valid <sources>
#
# Data (dataset.create_dataset): data/training/train/*.mp4, data/training/valid/{gt,degraded}/*.mp4

seed: 2026

model:
  # MambaOFR's RNN_Swin_4 one to one (3.48 M params without RAFT) on the LR
  # input; the SR is done by its BasicVSR-style tail. Trained from scratch.
  num_feat: 16            # propagated state channels
  embed_dim: 64           # Mamba restorer width, one restorer per propagation direction
  depths: [2, 2, 2]       # VSS blocks per residual group
  d_state: 16             # SSM state dimension
  ssm_expand: 1.2         # SS2D inner expansion (MambaOFR's mlp_ratio)
  dyn_kernels: 8          # degradation-aware prompt: kernels mixed per frame
  drop_path: 0.1          # stochastic depth (MambaIR default, inherited by MambaOFR)
  # Optical flow, torchvision RAFT: sintel = MambaOFR's raft-sintel.pth | large | small
  raft: sintel
  raft_iters: 24          # MambaOFR: 24
  # Tail: fusion of both directions -> conv + PixelShuffle x sr_scale -> convs
  # at HR, + the bilinear-upsampled input. MambaOFR's tail is 16 wide (made for
  # scale 1); 64 as BasicVSR's gives the HR detail capacity. Out of memory: 32.
  sr_scale: 2             # SR factor; GT / degraded size of the datasets
  tail_feat: 64

  # ---- phase 2; built in phase 1 too, so every checkpoint holds the whole
  # model. model.use_holes is set by the trainer from training.stage.
  inpaint_dim: 64         # Mamba inpainter: width and VSS blocks per group
  inpaint_depths: [2, 2, 2]
  # Detector probability above which the input is pre-filled. hole_pos_weight
  # = 10 inflates the probabilities: 0.9 ~ a true 50 %.
  hole_threshold: 0.9
  inpaint_dilate: 4       # the inpainter acts on the hole probability dilated by this (LR px)
  hole_prob: 0.25         # prob. a window gets holes burned in (phase 2 training + its valid pairs)

training:
  stage: restore          # restore = phase 1 | inpaint = phase 2
  # x 120 batches (240 clips / batch 2): 240k iterations as MambaOFR | 60k fine-tuning
  epochs: {restore: 2000, inpaint: 500}
  # Phase 2 starts from these weights (EMA) when its exp_dir has no latest.pth.
  init_from: experiments/revivid_p1_mambaofr/checkpoints/best.pth
  backbone_lr_mult: 0.1   # phase 2: lr of the phase-1 part; detector, flow completion, inpainter train at lr
  batch_size: 2           # as your MambaOFR run (1 GPU x 2)
  num_frame: 7
  # Random GT crop [w, h]; the LQ crop is gt_size / sr_scale = what the backbone
  # sees: 256 x 256 as in MambaOFR (a 256 GT crop gave it only 128 x 128 - a
  # quarter of MambaOFR's context and training pixels). Needs train clips of
  # >= 512 px both ways (REDS: 1280 x 720). Out of memory: [384, 384].
  gt_size: [512, 512]
  augment: true           # random flips / 90° rotation
  num_workers: 10
  # MambaOFR trains against a USM-sharpened GT (weight 0.5, radius 50,
  # threshold 10): crisper output instead of the average of what the input
  # allows. 0 = off. Validation always compares with the unsharpened GT.
  gt_usm: 0.5

  # MambaOFR's schedule (your run's log): Adam(0.9, 0.999), lr 2e-4 for the
  # first 60 % of the run, then 8 equal steps down, one per 12k iterations
  # (100 epochs here): 1.8e-4, 1.6e-4 ... the last 12k iterations at 4e-5 =
  # 0.2 * lr. The discriminator follows in proportion. Phase 2 fine-tunes at
  # half of it, with the same shape.
  lr: {restore: 0.0002, inpaint: 0.0001}
  lr_min: {restore: 0.00004, inpaint: 0.00002}   # lr of the last step
  lr_steady: 0.6          # fraction of the epochs at the full lr
  lr_steps: 8             # equal steps from lr down to lr_min
  beta1: 0.9
  beta2: 0.999
  # Optimizer steps every grad_accum batches (effective batch = batch_size * grad_accum).
  grad_accum: 1
  grad_clip: 0            # max gradient norm, 0 = off (MambaOFR); the log shows gnorm
  ema_decay: 0.999        # EMA weights are used for validation and inference

  hole_loss_boost: 3.0    # true-hole pixels weigh 1 + this in `pix` (phase 2)
  hole_pos_weight: 10.0   # BCE weight of the hole class (phase 2)

  # Generator loss = sum of weight * term; a 0 weight skips the term.
  # Phase 1 = MambaOFR's loss exactly: L1 1.0 + perceptual 1.0 + GAN 0.01.
  loss_weights:
    pix: 1.0              # Charbonnier(out, gt)            MambaOFR: L1, 1.0
    perceptual: 1.0       # VGG19 relu1_1..relu5_1          MambaOFR: 1.0
    # Hinge vs MambaOFR's 3-D clip discriminator (MambaOFR: 0.01). Phase 2
    # pushes realism - filled holes and the places of removed dirt must not
    # look painted; a starting point to tune by eye.
    gan: {restore: 0.01, inpaint: 0.05}
    detect: 0.05          # phase 2: hole detector BCE vs the true mask

  gan:
    start_iter: 0         # MambaOFR trains the GAN from the first iteration
    d_lr: 0.0002          # decays together with lr
    beta1: 0.9
    beta2: 0.999

validation:
  # The model on the stored valid pairs (data/training/valid; phase 2: it
  # finds the holes itself): PSNR, SSIM, the same at LR (psnr_lr / ssim_lr =
  # output and GT downscaled to the input size: MambaOFR's task on the same
  # input, comparable with MambaOFR run on the degraded clips), LPIPS,
  # flicker, sharpness. gt_size [w, h] is the size dataset.create_dataset
  # writes the valid clips at (LQ = gt_size / sr_scale).
  gt_size: [640, 360]
  # best.pth: phase 1 the highest PSNR (fidelity), phase 2 the lowest LPIPS
  # (realism). Any validation metric: psnr, ssim, psnr_lr, ssim_lr, lpips, flicker.
  best_metric: {restore: psnr, inpaint: lpips}
  # Frames per window. The model is recurrent: a longer window gives every frame
  # more neighbours to take detail from. MambaOFR tests with 20.
  window: 20
  val_every: 10           # epochs
  max_clips: 0            # 0 = all
  max_frames: 0           # per clip, 0 = all
  num_workers: 5

logging:
  exp_dir: {restore: ./experiments/revivid_p1_mambaofr, inpaint: ./experiments/revivid_p2}
  log_every: 120          # iterations
  # latest.pth (what training resumes from) every this many epochs; numbered
  # snapshots epochNNNN.pth every keep_checkpoint_every epochs (0 = none).
  save_checkpoint_every: 1
  keep_checkpoint_every: 100
