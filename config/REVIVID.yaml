# REVIVID configuration — diffusion restoration model.
#
# One diffusion network handles all tasks simultaneously:
#   1. Restoration — remove degradations (scratches, noise, blur, compression)
#   2. SR          — 4× super-resolution via PixelShuffle in the backbone
#   3. Inpainting  — hallucinate content in large burned-in holes
#
# Persistent spatial holes (baked by DatasetCreator for test clips and a fraction
# of train clips) are detected on-the-fly from the LQ fill value (-1.0) and fed
# as an explicit conditioning channel to the single refine UNet.
#
# SINGLE-PHASE TRAINING: all tasks (restoration, SR, holes) are on from the
# first iteration. During training the hole conditioning comes from the LQ
# fill-value threshold (ground truth), not from the detector, so there is no
# warmup dependency. The only internal schedule is the RAFT flow warmup
# (training.raft_unfreeze_iter), handled automatically by the trainer.
#
# Data locations are fixed by the pipeline and NOT configured here:
#   sources.yaml → downloader → data/raw/
#   data/raw/    → dataset_creator → data/training/{train,valid,test}/{degraded,gt}

seed: 2026

# --------------------------------------------------------------------------- #
# Model architecture
# --------------------------------------------------------------------------- #
model:
  # Recurrent conditioning backbone (MambaOFR-inspired). The coarse branch is
  # the metric-critical part of the model — keep it larger than the refiner.
  num_feat: 32            # propagation feature channels
  num_block: 6            # SSM blocks per propagation branch
  embed_dim: 64           # internal width of SSM blocks
  cond_dim: 64            # conditioning features fed to the diffusion head
  d_state: 16             # SSM state dimension
  ssm_expand: 2           # SSM inner expansion factor
  # RAFT warmup/fine-tune is configured in training.raft_unfreeze_iter

  # Super-resolution upscale factor in the backbone (PixelShuffle)
  # and LR downscale factor for dataset generation.
  # Powers of two only: 1 (no SR), 2 (2×), 4 (4×).
  # NOTE: changing this changes the backbone (build_upsampler adds/removes a
  # PixelShuffle stage), so old checkpoints will not load. It also invalidates
  # the baked valid/degraded clips - regenerate that split after changing it.
  sr_scale: 2

  # Diffusion UNet refiner (no down/up attn — Mamba backbone provides global
  # context; conditioning is re-injected at every encoder level).
  refiner_base: 48
  channel_mult: [1, 2, 3]
  num_res_blocks: 2

  # Diffusion process
  num_timesteps: 1000
  schedule: cosine
  refine_steps: 8         # DDIM steps at inference

  # The diffusion works on (gt - coarse) divided by a RUNNING estimate of that
  # residual's std, so the target always lands in the schedule's native
  # ~N(0, 1) range. A fixed scale does not survive training: as the coarse
  # branch improves the residual shrinks, the target collapses towards zero,
  # v becomes a closed form of x_t and the refiner stops learning (this is
  # exactly what happened in revivid_v3 - loss_v stuck at 0.0027 and the
  # refiner cost -0.9 dB on every one of 307 validations).
  residual_std_init: 0.15     # seed, only used before the first train step
  residual_std_momentum: 0.99 # EMA momentum of the running std
  residual_std_warmup: 200    # iters using the raw batch std (fast lock-on)
  residual_std_min: 0.001     # floor, guards against dividing by ~0

  min_snr_gamma: 5.0      # Min-SNR loss weighting (0 = off); speeds up convergence

  # Spatial hole detection (inference only — training uses on-the-fly threshold)
  hole_threshold: 0.5

  # Persistent spatial holes (baked per window by DatasetCreator / DataLoader)
  hole_prob: 0.25         # prob a training window has holes burned in

# --------------------------------------------------------------------------- #
# Training
# --------------------------------------------------------------------------- #
training:
  epochs: 4000
  batch_size: 1
  num_frame: 7

  # Fixed-size random GT crop, [width, height], taken at the clips' native
  # resolution — MambaOFR's paired_random_crop (their train `gt_size`). Only
  # the crop position is random; the size the model sees is always this.
  # The LQ crop is always gt_size / sr_scale, so with sr_scale 4:
  #   [400, 400] -> GT 400×400, LQ 100×100
  #   [512, 288] -> GT 512×288, LQ 128×72
  # Snapped to a multiple of sr_scale*4 (see validation.gt_size).
  # Set gt_size: ~ to train on whole frames at native resolution.
  gt_size: [256, 256]

  lr: 0.0002              # linear decay from lr to lr_min over all epochs
  lr_min: 0.000001
  beta1: 0.9
  beta2: 0.99

  # Optimizer steps every `grad_accum` batches (effective batch = batch_size * grad_accum).
  grad_accum: 8

  # EMA of the weights, used for validation and checkpointed inference.
  ema_decay: 0.999

  # RAFT flow warmup: frozen for the first N iterations, then fine-tuned at
  # lr * flow_lr_mul (MambaOFR recipe). Set raft_unfreeze_iter: -1 to keep frozen.
  raft_unfreeze_iter: 20000
  flow_lr_mul: 0.125

  # Loss re-weighting inside persistent holes: pixels under the hole mask get
  # weight (1 + hole_loss_boost) in the coarse pixel loss and diffusion v-loss.
  hole_loss_boost: 3.0

  # BCE pos_weight for the hole detector — holes are a tiny pixel minority,
  # so the positive class is up-weighted to keep the detector sensitive.
  hole_pos_weight: 10.0

  use_perceptual: true

  loss_weights:
    pix: 1.0              # Charbonnier on coarse restoration (backbone)
    perceptual: 0.1       # VGG perceptual on coarse
    detect: 0.05          # BCE on hole_head (hole detector)
    v: 1.0                # v-prediction diffusion loss (restoration + SR + inpaint)
    # Losses on the FINAL refined output (coarse + predicted residual):
    refine_pix: 1.0        # Charbonnier on refined - anchors it to GT in pixel
                           # space, which is what val_psnr measures
    refine_perceptual: 0.1 # VGG perceptual on refined
    refine_fft: 0.5        # frequency-domain loss on refined (recover fine texture)
    refine_grad: 0.5       # Sobel gradient loss on refined (crisp edges)
  refine_snr_weight: true  # scale refined losses by alphas_cumprod[t] (down-weight noisy x0_pred)

  num_workers: 10

  # On-the-fly degradation (textures cached once per DataLoader worker).
  # Default directory: data/raw/noise_data
  use_flip: true
  use_rot: true

# --------------------------------------------------------------------------- #
# Validation / logging
# --------------------------------------------------------------------------- #
validation:
  # MambaOFR validation protocol: never a crop. Whole frames, whole clips, and
  # the model's own `model.refine_steps` — the trainer chunks each clip by
  # num_frame and concatenates before computing metrics, exactly like
  # MambaOFR's val_frame_num loop. Validation therefore always measures the
  # same path as real inference; the only knob is the resolution below.
  #
  # gt_size is [width, height] in GT pixels — pick whatever you can afford.
  # The LQ fed to the network is always gt_size / sr_scale, so with sr_scale 4:
  #   [640, 368]  -> GT 640×368,  LQ 160×92   (matches MambaOFR's REDS4 val)
  #   [960, 544]  -> GT 960×544,  LQ 240×136
  #   [1280, 720] -> native REDS resolution — LQ 320×180 matches the baked
  #                  degraded clips exactly, so the LQ is not resampled at all
  #                  (slowest; watch host RAM at num_workers > 2).
  # Both sides are snapped to a multiple of sr_scale*4 so the LQ stays integral
  # and the refiner UNet needs no padding. Set gt_size: ~ for native size.
  gt_size: [640, 360]

  val_every: 10          # run validation every N epochs (1 = every epoch)
  max_clips: 0           # cap number of validation clips (0 = all)
  max_frames: 0          # cap frames evaluated per clip (0 = all)
  num_workers: 5         # DataLoader workers for validation (0 = main process)

logging:
  log_every: 120
  exp_dir: ./experiments/revivid
  save_checkpoint_every: 10   # numbered + latest checkpoints (not every epoch)
