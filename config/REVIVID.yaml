# REVIVID — restoration + 2x SR + inpainting of persistent holes, aimed at
# REALISM: a viewer should not be able to tell what was repaired.
#
# The model's only input is the degraded clip. It detects the holes itself;
# the true hole mask of a training sample is a target only (detector BCE,
# loss weighting, where the refiner is trained). Outside holes the output is
# the backbone's coarse restoration (trained with pix + perceptual + GAN +
# flicker); inside them a diffusion refiner invents what the propagation could
# not bring in from other frames.
#
# Train (no arguments needed):  python src/trainer/trainer.py
# Data (dataset.create_dataset): data/training/train/*.mp4, data/training/valid/{gt,degraded}/*.mp4

seed: 2026

model:
  # Backbone
  num_feat: 32            # propagation feature channels
  num_block: 6            # SS2D blocks per propagation direction
  embed_dim: 64           # internal width of the SS2D blocks
  d_state: 16             # SSM state dimension
  ssm_expand: 2           # SSM inner expansion factor
  cond_dim: 64            # backbone features handed to the refiner
  deg_dim: 64             # self-learned degradation code (FiLM on every SS2D block)
  dcn_groups: 8           # groups of the second-order flow-guided DCN (divides 2*num_feat)
  # SR factor of the model and GT / degraded size of the generated datasets.
  sr_scale: 2

  # Refiner (diffusion UNet, acts only inside detected holes)
  refiner_base: 48
  channel_mult: [1, 2, 3]
  num_res_blocks: 2
  refiner_temporal_levels: [1, 2]   # UNet levels with attention across the frames
  num_timesteps: 1000
  refine_steps: 8         # DDIM steps at inference
  min_snr_gamma: 5.0      # Min-SNR weighting of the diffusion loss (0 = off)
  # The diffusion target is (gt - coarse) / running std of it inside the holes.
  residual_std_init: 0.15
  residual_std_momentum: 0.99
  residual_std_warmup: 200
  residual_std_min: 0.001

  # Holes
  # Detector probability above which a pixel is a hole. hole_pos_weight = 10
  # inflates the probabilities: 0.9 ~ a true 50 %. Measured (2000 detector
  # steps): precision 0.97 / recall 0.977; a missed edge pixel is covered by
  # refine_mask_dilate.
  hole_threshold: 0.9
  refine_mask_dilate: 8   # refiner region = detected holes dilated by this (HR px)
  hole_prob: 0.25         # prob. a window gets holes burned in (training + dataset creation)

training:
  epochs: 4000
  batch_size: 1
  num_frame: 7
  gt_size: [256, 256]     # random GT crop [w, h]; the LQ crop is gt_size / sr_scale
  augment: true           # random flips / 90° rotation
  num_workers: 10

  lr: 0.0002              # linear decay to lr_min over all epochs
  lr_min: 0.000001
  beta1: 0.9
  beta2: 0.99
  grad_accum: 8           # effective batch = batch_size * grad_accum
  grad_clip: 1.0
  ema_decay: 0.999        # EMA weights are used for validation and inference

  # RAFT is frozen for the first N iterations, then fine-tuned at lr * flow_lr_mul
  # (-1 = always frozen).
  raft_unfreeze_iter: 20000
  flow_lr_mul: 0.125

  hole_loss_boost: 3.0    # true-hole pixels weigh 1 + this in `pix`
  hole_pos_weight: 10.0   # BCE weight of the hole class (holes are a pixel minority)

  # Generator loss = sum of weight * term:
  loss_weights:
    pix: 1.0              # Charbonnier(coarse, gt) - content fidelity
    perceptual: 0.1       # VGG19 feature distance (raw ~8, i.e. ~0.8 effective)
    gan: 0.05             # adversarial, projected patch discriminator (see gan:)
    temporal: 0.5         # flicker vs the GT's own motion
    detect: 0.05          # hole detector BCE vs the true mask
    v: 1.0                # refiner diffusion loss inside the true holes

  # Projected patch discriminator: small trainable heads on frozen VGG19
  # features (4 scales, patch logits, hinge loss). Starts after start_iter
  # iterations, once the generator has learned the structure.
  gan:
    start_iter: 5000
    d_lr: 0.0001          # decays together with lr
    beta1: 0.0
    beta2: 0.99

validation:
  # Full inference path on the stored valid pairs (the model detects the holes
  # itself). Reports LPIPS, flicker, PSNR, SSIM of the final output;
  # best.pth = lowest LPIPS. gt_size [w, h] is the size dataset.create_dataset
  # writes the valid clips at (LQ = gt_size / sr_scale).
  gt_size: [640, 360]
  val_every: 10           # epochs
  max_clips: 0            # 0 = all
  max_frames: 0           # per clip, 0 = all
  num_workers: 5

logging:
  exp_dir: ./experiments/revivid_v5
  log_every: 120          # iterations
  save_checkpoint_every: 10   # epochs (numbered + latest.pth)
